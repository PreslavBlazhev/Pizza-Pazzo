# AndroidX is mandatory for modern dependencies.
android.useAndroidX=true
# Kotlin code style
kotlin.code.style=official
# Faster builds
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# ── The Pizza Pazzo site this app opens (baked into the build) ─────────────
# When the new .com domain goes live: ADD it to siteHosts (keep the old ones
# until every installed app has updated), point startUrl at it, bump
# versionCode and rebuild. See docs/domain-and-deploy.md.
pizzapazzo.startUrl=https://pizza-pazzo.onrender.com/
pizzapazzo.siteHosts=pizza-pazzo.onrender.com,pizzapazzo.bg,www.pizzapazzo.bg

# The STAGING demo shop, used only by the "staging" build type
# (gradlew assembleStaging). If Render gave the staging service a different
# address, put it here and rebuild.
pizzapazzo.stagingUrl=https://pizza-pazzo-staging.onrender.com/
