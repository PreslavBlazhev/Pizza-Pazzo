# Render Blueprint for Pizza Pazzo (SQLite + Prisma + Persistent Disk).
#
# This is an OPTIONAL convenience: Render can read it to provision the service.
# Secrets and the real domain are intentionally NOT hardcoded — set them in the
# Render dashboard (sync: false means "prompt me, don't store in git").
#
# See docs/render-sqlite-deploy.md for the full walkthrough.

services:
  - type: web
    name: pizza-pazzo
    runtime: node
    plan: starter # needs a paid plan for Persistent Disks
    branch: master
    # migrate deploy runs at START, not build: the Persistent Disk (and so the
    # SQLite file) is NOT mounted during builds. Pages that read the menu render
    # dynamically for the same reason (see docs/admin-menu-db-plan.md).
    # When a migration is pending, a checked VACUUM INTO backup is written to
    # /var/data/backups/ first; if it fails, the start stops before migrating
    # and Render keeps the previous deploy (scripts/backup-before-migrate.mjs).
    # npm ci installs exactly package-lock.json. Everything the build needs
    # (Tailwind, PostCSS, Autoprefixer, TypeScript and its types, the Prisma
    # CLI) is in "dependencies", so it is installed even when NODE_ENV is
    # production, where npm leaves devDependencies out. The Prisma CLI is
    # also needed at start for migrate deploy.
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: node scripts/backup-before-migrate.mjs && npx prisma migrate deploy && npm start

    # SQLite file lives on this disk so it survives redeploys/restarts.
    disk:
      name: pizza-pazzo-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # DATABASE_URL points at the Persistent Disk mount above.
      - key: DATABASE_URL
        value: file:/var/data/pizza-pazzo.db

      # Admin-uploaded product photos are also stored on the same Persistent
      # Disk (a subfolder next to the DB file), so they survive redeploys and
      # restarts. See lib/uploads/paths.ts.
      - key: UPLOADS_DIR
        value: /var/data/uploads

      # Secrets / environment-specific — set these in the dashboard.
      - key: AUTH_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ORDER_NOTIFICATION_EMAIL
        sync: false
      - key: FROM_EMAIL
        sync: false
      # THE public address (https://…, no trailing slash). Canonical URLs, the
      # sitemap and the bank's return/callback addresses are all built from it
      # — the move to the .com domain is this one value (docs/domain-and-deploy.md).
      - key: APP_BASE_URL
        sync: false

      # This service is the real restaurant. The payment simulator and bank
      # sandboxes refuse to run here (lib/payments/config.ts).
      - key: APP_ENV
        value: production

      # Online card payments: OFF until the bank contract and a successful
      # sandbox test exist (docs/online-card-payments.md §3.5). This is also
      # the emergency switch — set to false and save to turn cards off.
      - key: CARD_PAYMENTS_ENABLED
        value: "false"
      - key: PAYMENT_PROVIDER
        sync: false
      - key: PAYMENT_ENV
        sync: false
      - key: PAYMENT_CURRENCY
        sync: false
      # The scheduler's key for POST /api/maintenance/run (the 22:30 purge,
      # the customer e-mail outbox and retries). ≥ 32 random characters.
      - key: MAINTENANCE_SECRET
        sync: false

  # The schedulers for the daily 22:30 retention (lib/order-purge.ts). A
  # Cron Job cannot mount the web service's disk, so it CALLS the web service.
  # Render cron schedules are UTC; 22:30 Europe/Sofia is 19:30 UTC in summer
  # and 20:30 UTC in winter, so the PRIMARY job runs at both — the run that
  # is an hour off is a harmless no-op (the cutoff is computed by the app).
  # The FALLBACK runs every 5 minutes and catches a missed or failed run.
  # The endpoint answers 500 on any failure, so Render marks the run failed.
  # Exact unavailability at 22:30 does not depend on these (lib/db.ts); the
  # time of physical deletion does — MaintenanceState records it.
  # Commented out on purpose: each job is a (billed) service — create them
  # deliberately when deploying this change (IMPLEMENTATION_REPORT.md §9–10).
  #
  # - type: cron
  #   name: pizza-pazzo-purge-2230
  #   runtime: node
  #   schedule: "30 19,20 * * *"
  #   buildCommand: "true"
  #   startCommand: >-
  #     curl -fsS --retry 3 --retry-delay 10 -X POST
  #     -H "Authorization: Bearer $MAINTENANCE_SECRET"
  #     "https://pizzapazzo.bg/api/maintenance/run?trigger=cutoff"
  #   envVars:
  #     - key: MAINTENANCE_SECRET
  #       sync: false
  #
  # - type: cron
  #   name: pizza-pazzo-maintenance-fallback
  #   runtime: node
  #   schedule: "*/5 * * * *"
  #   buildCommand: "true"
  #   startCommand: >-
  #     curl -fsS -X POST -H "Authorization: Bearer $MAINTENANCE_SECRET"
  #     "https://pizzapazzo.bg/api/maintenance/run?trigger=fallback"
  #   envVars:
  #     - key: MAINTENANCE_SECRET
  #       sync: false
