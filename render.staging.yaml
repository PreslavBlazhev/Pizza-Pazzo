# Render Blueprint for the STAGING copy of Pizza Pazzo — the demo shop with
# the payment simulator. NOT the real restaurant: its own service, its own
# database, its own secrets, e-mail off, password in front, never indexed.
#
# Create it: Render → New → Blueprint → this repository → "Blueprint path":
# render.staging.yaml. (The default render.yaml is production — leave it.)
# Full walkthrough: docs/online-card-payments.md §3.1.
#
# COST: `plan: free` costs nothing, but a free instance has NO persistent
# disk and sleeps after ~15 min without visitors — the SQLite file below is
# recreated (empty, then re-seeded with the menu and test accounts) on every
# restart and deploy, so test orders do not survive a nap. For a staging
# database that survives, switch to `plan: starter` (paid) and uncomment the
# disk + the /var/data DATABASE_URL.

services:
  - type: web
    name: pizza-pazzo-staging
    runtime: node
    plan: free
    # The demo form lives on this branch until it is merged; switch to master
    # afterwards (Render → Settings → Branch).
    branch: feat/payment-simulator-demo
    buildCommand: npm install && npx prisma generate && npm run build
    # Migrations, then test accounts + menu (idempotent; refuses to run
    # unless APP_ENV is staging/development), then the app.
    startCommand: npx prisma migrate deploy && node scripts/seed-staging.mjs && npm start

    # Paid plan only — a database that survives restarts:
    # disk:
    #   name: pizza-pazzo-staging-data
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      - key: APP_ENV
        value: staging
      # Ephemeral on the free plan (inside the service's own file system —
      # it cannot point at production's disk). Paid plan with the disk above:
      # file:/var/data/pizza-pazzo-staging.db
      - key: DATABASE_URL
        value: file:./staging.db
      # Leave APP_BASE_URL unset: on staging the site falls back to Render's
      # own RENDER_EXTERNAL_URL (https://pizza-pazzo-staging…onrender.com).

      - key: CARD_PAYMENTS_ENABLED
        value: "true"
      - key: PAYMENT_PROVIDER
        value: simulator

      # Real e-mail is off on staging in code anyway; this says it twice.
      - key: EMAIL_DELIVERY
        value: disabled

      # Secrets generated by Render — different from production by construction.
      - key: AUTH_SECRET
        generateValue: true
      - key: PAYMENT_SIMULATOR_SECRET
        generateValue: true
      # Browser password for the whole staging site: user "staging",
      # password = this value (Render → Environment → reveal).
      - key: STAGING_BASIC_AUTH_PASSWORD
        generateValue: true
      # Logins created by scripts/seed-staging.mjs:
      #   admin@staging.pizzapazzo.test / staff@… / customer@…
      - key: STAGING_ADMIN_PASSWORD
        generateValue: true
      - key: STAGING_STAFF_PASSWORD
        generateValue: true
      - key: STAGING_CUSTOMER_PASSWORD
        generateValue: true
